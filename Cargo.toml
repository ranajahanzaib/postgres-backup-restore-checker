[package]
name = "postgres-backup-restore-checker"
version = "0.1.0"
edition = "2024"
description = "Restore PostgreSQL logical backups in isolated Docker containers and verify their contents"
license = "MIT"
repository = "https://github.com/ranajahanzaib/postgres-backup-restore-checker"
readme = "README.md"
keywords = ["postgresql", "backup", "restore", "recovery", "cli"]
categories = ["command-line-utilities", "database-implementations"]
exclude = ["/PLAN.md", "/.github/**", "/.gitignore"]

[[bin]]
name = "pbrc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
